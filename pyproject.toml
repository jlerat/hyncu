[build-system]
requires = [
    "setuptools >= 64"
]
build-backend = "setuptools.build_meta"

[project]
name = "hyncu"
authors = [{name = "Julien Lerat, CSIRO Environment", email="julien.lerat@csiro.au"}]
description = "Solve the approximate reservoir equation using the QuaSoARe method"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["netcdf", "multi-dimensional array", "hydrology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python 3",
    "Topic :: Scientific/Engineering :: Hydrology"
]    
requires-python = ">= 3.8"
dependencies = [
    "numpy >= 1.20.0",
    "pandas >= 2.0.0",
    "netcdf4>=1.6.4"
]
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hyncu.__version__"}
