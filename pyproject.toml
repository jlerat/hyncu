[build-system]
requires = [
    "setuptools >= 64"
]
build-backend = "setuptools.build_meta"

[project]
name = "hyncu"
version = "1.1"
authors = [{name = "Julien Lerat, CSIRO Environment", email="julien.lerat@csiro.au"}]
description = "Package to store hydrological timeseries data into NetCDF files"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["netcdf", "multi-dimensional array", "hydrology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python 3",
    "Topic :: Scientific/Engineering :: Hydrology"
]    
requires-python = ">= 3.8"

dependencies = [
    "numpy",
    "pandas",
    "netcdf4",
    "cf_units"
]

[dependency-groups]
dev = [
    "anybadge>=1.16.0",
    "ruff>=0.15.12",
    "pytest>=8.3.5",
    "pytest-allclose>=1.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.setuptools.packages.find]
where = ["src"]

