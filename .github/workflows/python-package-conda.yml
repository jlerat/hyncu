name: Build hyncu

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    strategy:
      max-parallel: 5
    
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
     
      - name: Add conda to system path
        run: |
          # $CONDA is an environment variable pointing to the root of the miniconda directory
          echo $CONDA/bin >> $GITHUB_PATH
      
      - name: Create conda environment if needed
        run: |
           source $CONDA/etc/profile.d/conda.sh
           conda env create -f env_hyncu.yml

      - name : Install hyncu package in conda env 
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate env_hyncu
          cd $GITHUB_WORKSPACE
          echo "--- hyncu install : located in $PWD ---"
          pip install -e .

      - name: Lint with flake8
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate env_hyncu
          cd $GITHUB_WORKSPACE
          flake8 src/hyncu

      - name: Run tests
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate env_hyncu
          cd $GITHUB_WORKSPACE
          echo "--- hyncu test : located in $PWD ---"
          pytest --cov=hyncu --cov-report=xml --cov-report=html --cov-report=term-missing tests
      
      - name: Parse coverage report
        run: |
          python -c "import xml.etree.ElementTree as ET; coverage = float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100; print(f'{round(coverage)}%')" > coverage-value.txt
          python -c "with open('coverage-value.txt') as f: cov = f.read(); import re; cov = float(re.sub('[^\d\.]', '', cov)); color = 'red' if cov < 70 else ('orange' if cov < 80 else ('lightgreen' if cov <95 else 'green')); print(color)" > coverage-color.txt 

      - name: Update gist badge content
        run: |
          echo "{\"files\": {\"coverage-value.json\": {\"content\": \"$(cat coverage-value.txt)\"}}}" > coverage-value.json
          curl -X PATCH -H "Authorization: token ${{ secrets.COVERAGE_GIST_TOKEN }}" \
                -d @coverage-value.json \
                "https://api.github.com/gists/${{ secrets.COVERAGE_GIST_ID }}"

      - name: Update gist badge color
        run: |
          echo "{\"files\": {\"coverage-color.json\": {\"content\": \"$(cat coverage-color.txt)\"}}}" > coverage-color.json
          curl -X PATCH -H "Authorization: token ${{ secrets.COVERAGE_GIST_TOKEN }}" \
                -d @coverage-color.json \
                "https://api.github.com/gists/${{ secrets.COVERAGE_GIST_ID }}"


      - name: Upload pytest test log files
        uses: actions/upload-artifact@v3
        with:
          name: pytest-logs
          path: tests/*.log

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: pytest-coverage
          path: htmlcov/*.*
